<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>주소 검색</title>
    <script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; }
        #layer { display:block; width:100%; height:100%; -webkit-overflow-scrolling:touch; }
    </style>
</head>
<body>
    <div id="layer"></div>
    <script>
        // 1. URL 파라미터 가져오기 및 디코딩
        var urlParams = new URLSearchParams(window.location.search);
        var rawQuery = urlParams.get('q');
        var query = rawQuery ? decodeURIComponent(rawQuery) : '';

        // [디버깅] 이 알림창이 떠야 새 코드입니다! 확인 후 주석 처리하세요.
        if (query) {
             alert("검색어 확인: " + query); 
        }

        var element_layer = document.getElementById('layer');

        // 2. Daum API 로드 대기 후 실행
        daum.postcode.load(function() {
            new daum.Postcode({
                oncomplete: function(data) {
                    var fullAddress = data.roadAddress;
                    var sido = data.sido;
                    var sidoMap = {
                        "서울": "서울특별시", "경기": "경기도", "부산": "부산광역시",
                        "대구": "대구광역시", "인천": "인천광역시", "광주": "광주광역시",
                        "대전": "대전광역시", "울산": "울산광역시", "세종": "세종특별자치시",
                        "강원": "강원도", "충북": "충청북도", "충남": "충청남도",
                        "전북": "전라북도", "전남": "전라남도", "경북": "경상북도",
                        "경남": "경상남도", "제주": "제주특별자치도"
                    };

                    if (sidoMap[sido]) {
                        fullAddress = fullAddress.replace(sido, sidoMap[sido]);
                    }

                    // Flutter 앱으로 결과 전송
                    if (window.DaumPostcode && window.DaumPostcode.postMessage) {
                        window.DaumPostcode.postMessage(fullAddress);
                    } else if (window.parent) {
                        window.parent.postMessage(fullAddress, "*");
                    }
                },
                width: '100%',
                height: '100%',
                maxSuggestItems: 5,
                q: query // 검색어 주입
            }).embed(element_layer);
        });
    </script>
</body>
</html>
