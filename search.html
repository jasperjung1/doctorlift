<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>주소 검색 - Dr.Lift</title>
    <script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; }
        #layer { width: 100%; height: 100%; position: absolute; }
    </style>
</head>
<body>
    <div id="layer"></div>

    <script>
        // 1. URL에서 검색어(q) 파싱
        const urlParams = new URLSearchParams(window.location.search);
        const query = urlParams.get('q'); // 예: "광명로 204"

        const element_layer = document.getElementById('layer');

        new daum.Postcode({
            oncomplete: function(data) {
                // 검색 결과가 선택되었을 때의 로직
                // (FlutterFlow나 앱으로 데이터를 보내는 로직이 여기에 들어갑니다)
                if(window.PostcodeHandler) {
                     window.PostcodeHandler.postMessage(JSON.stringify(data));
                }
            },
            width: '100%',
            height: '100%'
        }).embed(element_layer);

        // ✅ 핵심 로직: embed 된 후 강제로 검색어 넣고 엔터 치기
        if (query) {
            autoSearch(query);
        }

        function autoSearch(keyword) {
            // 카카오 우편번호 서비스는 iframe으로 생성되므로, 내부 DOM에 접근해야 함
            // 로딩 딜레이를 고려하여 0.1초마다 요소를 찾을 때까지 반복 체크
            let checkInterval = setInterval(function() {
                
                // Daum Postcode가 생성한 iframe 찾기
                let iframe = document.querySelector('iframe');
                
                if (iframe && iframe.contentDocument) {
                    let innerDoc = iframe.contentDocument || iframe.contentWindow.document;
                    
                    // 내부의 검색 입력창 찾기 (보통 id가 'region_name' 이거나 class가 'txt_search' 등임)
                    // 안전하게 input 태그 중 첫 번째 텍스트 박스를 타겟팅
                    let input = innerDoc.querySelector('input[type="text"]');
                    let searchBtn = innerDoc.querySelector('.btn_search'); // 검색 버튼 클래스

                    if (input) {
                        clearInterval(checkInterval); // 요소를 찾았으니 반복 중단

                        // 1. 값 강제 주입
                        input.value = keyword;

                        // 2. React/Vue 등 내부 프레임워크가 인식하도록 이벤트 발생
                        input.dispatchEvent(new Event('input', { bubbles: true }));
                        input.dispatchEvent(new Event('change', { bubbles: true }));

                        // 3. 엔터키 이벤트 발송 (가장 확실한 방법)
                        input.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', code: 'Enter', keyCode: 13, bubbles: true }));
                        input.dispatchEvent(new KeyboardEvent('keyup', { key: 'Enter', code: 'Enter', keyCode: 13, bubbles: true }));

                        // 4. 혹시 모르니 검색 버튼도 클릭 트리거
                        if (searchBtn) {
                            searchBtn.click();
                        }
                        
                        console.log("자동 검색 실행 완료: " + keyword);
                    }
                }
            }, 100); // 0.1초 간격으로 체크
        }
    </script>
</body>
</html>
